name: Validate and deploy Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      http2:
        description: Serve the test site over HTTP/2 (1) or HTTP/1.1 (0)
        default: '0'
      protocol_log:
        description: Record the Playwright protocol log (1) or not (0)
        default: '0'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}-${{ inputs.http2 }}-${{ inputs.protocol_log }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test privacy and security guards
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Check JavaScript syntax
        run: for script in *.js; do node --check "$script"; done
      - name: Validate and stage only public assets
        run: python3 .github/scripts/check_site.py --stage "$RUNNER_TEMP/public-site"
      - name: Upload checked site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/public-site
          retention-days: 1

  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned test dependencies
        run: npm ci --ignore-scripts
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Test navigation and visitor journeys
        run: npm test
        env:
          KEW_HTTP2: ${{ inputs.http2 }}
          KEW_DIAG_PROTOCOL: ${{ inputs.protocol_log }}
          KEW_DIAG_DIR: /tmp/kew-diag
          KEW_SERVER_LOG: /tmp/kew-diag/server.log
          NODE_OPTIONS: --require ${{ github.workspace }}/tests/browser/diag-preload.cjs
      - name: Trim protocol logs
        if: always()
        run: for f in /tmp/kew-diag/protocol-*.log; do [ -f "$f" ] && cut -c1-1500 "$f" > "$f.tmp" && mv "$f.tmp" "$f"; done; ls -la /tmp/kew-diag || true
      - name: Save redirect diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: redirect-diagnostics
          path: /tmp/kew-diag/
          retention-days: 7
      - name: Save browser report and failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-test-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [validate, browser-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
